<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fitPredict · Sign In</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <!-- NAVBAR (identical to home) -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="bi bi-activity"></i>
                fitPredict
            </div>
            <div class="nav-links">
                <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Sign In</a>
                <a href="/logon"><i class="bi bi-person-plus"></i> Sign Up</a>
            </div>
        </div>
    </nav>


    <!-- MAIN CONTENT: SIGN IN FORM -->
    <div class="main-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2><i class="bi bi-shield-lock"></i> Sign In</h2>
                <p>Enter your credentials to access your account</p>
            </div>

            {% if message %}
            <div class="error-message">
                <i class="bi bi-exclamation-triangle-fill"></i>
                {{ message }}
            </div>
            {% endif %}

            <form method="POST" action="/signin">
                <div class="form-group">
                    <label for="user">
                        <i class="bi bi-person"></i> Username
                    </label>
                    <input type="text" id="user" name="user" class="form-control" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="bi bi-key"></i> Password
                    </label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/logon">Sign up here</a></p>
            </div>
        </div>
    </div>


</body>
</html>
