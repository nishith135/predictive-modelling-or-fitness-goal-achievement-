<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fitPredict · Sign Up</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <!-- NAVBAR (identical to home) -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="bi bi-activity"></i>
                fitPredict
            </div>
            <div class="nav-links">
                <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a href="/login"><i class="bi bi-box-arrow-in-right"></i> Sign In</a>
                <a href="/logon"><i class="bi bi-person-plus"></i> Sign Up</a>
            </div>
        </div>
    </nav>



    <!-- MAIN CONTENT: SIGN UP FORM -->
    <div class="main-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2><i class="bi bi-person-plus-fill"></i> Sign Up</h2>
                <p>Create your account to get started</p>
            </div>

            {% if message %}
            <div class="error-message">
                <i class="bi bi-exclamation-triangle-fill"></i>
                {{ message }}
            </div>
            {% endif %}

            <form method="POST" action="/signup">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="user">
                            <i class="bi bi-person"></i> Username
                        </label>
                        <input type="text" id="user" name="user" class="form-control" placeholder="Choose a username" required>
                    </div>

                    <div class="form-group">
                        <label for="name">
                            <i class="bi bi-person-badge"></i> Full Name
                        </label>
                        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">
                            <i class="bi bi-envelope"></i> Email
                        </label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="your.email@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="mobile">
                            <i class="bi bi-phone"></i> Mobile
                        </label>
                        <input type="tel" id="mobile" name="mobile" class="form-control" placeholder="9876543210" required>
                    </div>

                    <div class="form-group full">
                        <label for="password">
                            <i class="bi bi-key"></i> Password
                        </label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <i class="bi bi-person-plus"></i> Create Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Sign in here</a></p>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-copy">
                <i class="bi bi-c-circle"></i> 2026 fitPredict — ML fitness modeling
            </div>
            <div class="footer-links">
                <a href="#"><i class="bi bi-shield-lock"></i> Privacy</a>
                <a href="#"><i class="bi bi-file-earmark-text"></i> Terms</a>
                <a href="#"><i class="bi bi-envelope"></i> Contact</a>
            </div>
        </div>
        <div class="footer-small">
            <span><i class="bi bi-person-plus"></i> user registration · secure signup</span>
        </div>
    </footer>
</body>
</html>
